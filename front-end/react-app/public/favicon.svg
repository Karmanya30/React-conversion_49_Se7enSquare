<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79C0FF" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Dark Mode Pro background -->
  <rect width="64" height="64" rx="16" fill="#0D1117" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#30363D" stroke-width="2" />

  <!-- Subtle ambient glow in center -->
  <circle cx="32" cy="32" r="20" fill="url(#glowGrad)" />

  <!-- Geometric Gamepad / Unity Emblem -->
  <!-- Main Controller Body: Bold geometric silhouette uniting two player nodes -->
  <path d="M16 22 C13 22, 10 25, 9 29 L7 40 C6 44, 9 48, 14 47 L20 44 C22 43, 24 43.5, 26 45 L29 47 C31 48, 33 48, 35 47 L38 45 C40 43.5, 42 43, 44 44 L50 47 C55 48, 58 44, 57 40 L55 29 C54 25, 51 22, 48 22 L40 23 C35 24, 29 24, 24 23 Z"
        fill="url(#accentGrad)" />

  <!-- Inner Top Arch / Unity Bridge Cutout -->
  <path d="M22 23 C26 25, 38 25, 42 23 C40 28, 36 30, 32 30 C28 30, 24 28, 22 23 Z"
        fill="#0D1117" />

  <!-- Central Unity Node: Diamond / Nexus Core -->
  <polygon points="32,32 36,36 32,40 28,36" fill="#FFFFFF" />

  <!-- Left D-Pad: Connected cross -->
  <rect x="17" y="33" width="3" height="9" rx="1.5" fill="#0D1117" />
  <rect x="14" y="36" width="9" height="3" rx="1.5" fill="#0D1117" />

  <!-- Right Action Buttons: 4 geometric nodes (Unity cluster) -->
  <circle cx="45" cy="33" r="1.8" fill="#0D1117" />
  <circle cx="49" cy="37" r="1.8" fill="#0D1117" />
  <circle cx="41" cy="37" r="1.8" fill="#0D1117" />
  <circle cx="45" cy="41" r="1.8" fill="#0D1117" />

  <circle cx="45" cy="33" r="1" fill="#FFFFFF" />
  <circle cx="49" cy="37" r="1" fill="#FFFFFF" />
  <circle cx="41" cy="37" r="1" fill="#FFFFFF" />
  <circle cx="45" cy="41" r="1" fill="#FFFFFF" />
</svg>